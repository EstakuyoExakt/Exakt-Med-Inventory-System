spring.application.name=backend

# ------------------------------
# H2 Database Configuration
# ------------------------------
spring.datasource.url=jdbc:h2:mem:exaktdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate: Automatically create and update database tables from entities
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------
# JWT Configuration
# ------------------------------
